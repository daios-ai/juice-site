title: Juice
# jekyll-seo-tag emits this as both `description` and `og:description`, where a
# search result or a shared link carries no wordmark above it, so it names Juice.
# The landing page's own heading does not: the masthead has just said the name,
# in type and in its aria-label. That heading is written out in index.md.
description: Juice — an economic network of capabilities for humans and agents.

url: https://daios-ai.github.io
baseurl: /juice-site          # project site path; drop when a custom domain is added

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

logo: /assets/juice-logo.svg

# The theme's _includes/favicon.html emits the <link> for this, having first
# checked the file is really there, and puts it through relative_url. The SVG
# and Apple icons it has no notion of; those are in _includes/head_custom.html.
favicon_ico: /assets/favicon.ico

search_enabled: true
heading_anchors: true
nav_sort: case_insensitive
color_scheme: tokyonight     # _sass/color_schemes/tokyonight.scss

# Rendered by _includes/components/aux_nav.html, which applies the base path to
# site-relative entries. External links need the scheme.
aux_links:
  Manual:
    - /juice/
  DAIOS:
    - https://daios.ai
  GitHub:
    - https://github.com/daios-ai

back_to_top: true
back_to_top_text: "Back to top"

# One collection per manual. Each is a separate navigation namespace, so the
# nav_order and parent values of different manuals never collide.
#
# permalink uses an explicit :output_ext so a page's URL is ".../running.html",
# matching both the file Jekyll writes and the relative links inside the
# manuals. Without it the URLs are extensionless and navigation and search
# would depend on the host redirecting.
collections:
  juice:
    output: true
    permalink: /:collection/:path:output_ext

# Manual pages carry no `layout` in their front matter. GitHub Pages would
# guess one via jekyll-default-layout; declaring it keeps local and CI builds
# identical.
defaults:
  - scope:
      path: ""
      type: juice
    values:
      layout: default

just_the_docs:
  collections:
    juice:
      name: Juice manual
      nav_fold: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - script
  - manuals.yml
  - README.md
  - node_modules
